name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public contribution data
        env:
          GH_PROFILE_USER: Sarvesh2905
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile contribution art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
